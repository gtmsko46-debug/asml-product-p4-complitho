[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asml_product_p4_complitho"
version = "0.1.0"
description = "Champion-facing polarization + wavelength-agile computational lithography product (P4/P7)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Product Manager Bot / Comp-Litho Product PI" }]
keywords = ["asml", "fel", "polarization", "wavelength", "computational-lithography"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["asml_product_p4_complitho*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
